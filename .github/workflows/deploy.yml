name: Deploy

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: QEMU 설정
        uses: docker/setup-qemu-action@v2

      - name: Buildx 설정
        uses: docker/setup-buildx-action@v2

#      - name: Docker Hub 로그인 (manual)
#        run: |
#          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login \
#          -u "${{ secrets.DOCKER_USERNAME }}" \
#          --password-stdin
      - name: Docker Hub 로그인
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: kong-dic application.yml 파일 생성
        run: |
          mkdir -p ./kong-dic/src/main/resources
          echo "${{ secrets.KONG_DIC_YML }}" > ./kong-dic/src/main/resources/application-dev.yml

      - name: kong-dic-admin application.yml 파일 생성
        run: |
          mkdir -p ./kong-dic-admin/src/main/resources
          echo "${{ secrets.KONG_DIC_ADMIN_YML }}" > ./kong-dic-admin/src/main/resources/application-dev.yml
          
      - name: kong-dic 빌드 & 푸시
        uses: docker/build-push-action@v4
        with:
          context: .
          file: kong-dic/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/kong-dic:latest
          platforms: linux/amd64,linux/arm64

      - name: kong-dic-admin 빌드 & 푸시
        uses: docker/build-push-action@v4
        with:
          context: .
          file: kong-dic-admin/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/kong-dic-admin:latest
          platforms: linux/amd64,linux/arm64

